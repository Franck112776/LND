<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de audio y vídeo</title>
</head>
<body>

    <h1>Reproductor de audio y vídeo</h1>

    <!-- Sección de Vídeo -->
    <section id="Video">
        <h2>Vídeo</h2>
        <video controls loop muted width="640">
            <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
        </video>
    </section>

    <!-- Sección de Audio -->
    <section id="Audio">
        <h2>Audio</h2>
        <audio loop controls src="https://cdn.freecodecamp.org/curriculum/js-music-player/we-are-going-to-make-it.mp3">
        </audio>
    </section>

</body>
</html>
